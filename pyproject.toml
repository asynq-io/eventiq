[project]
name = "eventiq"
version = "2.0.0rc"
description = "Publish/Subscribe asyncio framework for Python"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "Apache-2.0"
keywords = [
    "python",
    "framework",
    "asyncio",
    "microservice",
    "event-driven",
    "cloud-events",
    "asyncapi",
]
authors = [{ name = "RaRhAeu", email = "rarha_eu@protonmail.com" }]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "anyio>4.0,<5.0",
    "typer<1.0",
    "pydantic >2.0,<3",
    "pydantic-settings>2.0,<3",
    "pydantic-asyncapi==0.2.1",
]

[project.urls]
Documentation = "https://github.com/asynq-io/eventiq#readme"
Issues = "https://github.com/asynq-io/eventiq/issues"
Source = "https://github.com/asynq-io/eventiq"



[project.scripts]
eventiq = "eventiq.cli:cli"

[project.optional-dependencies]
nats = ["nats-py"]
rabbitmq = ["aio-pika"]
kafka = ["aiokafka"]
redis = ["redis"]
msgpack = ["ormsgpack"]


[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "docs"},
    "ipython",
    "watchfiles>=1.1.1",
]

test = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "pytest-repeat",
    "pytest-timeout",
]

lint = [
    "mypy",
    "ruff",
    "bandit",
    "types-pyyaml>=6.0.12.20250915",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-autorefs",
    "mkdocstrings[python]",
    "watchdog",
]


[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.coverage.run]
source_pkgs = ["eventiq"]
branch = true
parallel = true

[tool.coverage.paths]
package = ["eventiq"]
tests = ["tests"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
timeout = 3
addopts = "--cov=./eventiq"
testpaths = ["./tests"]
filterwarnings = "ignore::DeprecationWarning"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.10"
# strict = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_no_return = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py310"

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",
    "ANN401",
    "ASYNC109",
    "B008",     # do not perform function calls in argument defaults
    "BLE001",
    "COM812",
    "D",
    "E501",     # line too long
    "N818",
    "PLC0415",
    "PLR0913",
    "PTH123",
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "ANN001", "ANN201", "PLR2004", "ARG001", "ARG002", "ARG004"]
"examples/*" = ["S101", "ANN001", "ANN201", "INP001", "T201"]

[tool.bandit]
skips = ['B101']
